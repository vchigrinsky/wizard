<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <div class="container-lg px-3 my-5 markdown-body">
      {{ content }}

      {% if site.github.private != true and site.github.license %}
      <div class="footer border-top border-gray-light mt-5 pt-3 text-right text-gray">
        This site is open source. {% github_edit_link "Improve this page" %}.
      </div>
      {% endif %}
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/4.1.0/anchor.min.js" integrity="sha256-lZaRhKri35AyJSypXXs4o6OPFTbTmUoltBbDCbdzegg=" crossorigin="anonymous"></script>
    <script>anchors.add();</script>
    <script>
      document.addEventListener('click', async function (event) {
        var link = event.target.closest('a.js-copy-markdown');
        if (!link) return;
        event.preventDefault();
        var url = link.getAttribute('href');
        var original = link.textContent;
        try {
          var response = await fetch(url);
          if (!response.ok) throw new Error('fetch failed');
          var text = await response.text();
          await navigator.clipboard.writeText(text);
          link.textContent = 'Скопировано';
          setTimeout(function () { link.textContent = original; }, 1500);
        } catch (err) {
          link.textContent = 'Не удалось скопировать';
          setTimeout(function () { link.textContent = original; }, 2000);
        }
      });
    </script>
  </body>
</html>
